<section id="p3" dir="rtl" aria-label="דמו אינטראקטיבי: שליטה בבית מהטלפון">

</div>

</div></div>
</div>
<p class="note">הדגמה בלבד – בבית אמיתי הכפתורים שולטים במכשירים שלכם, גם בלי אינטרנט.</p>
</section>

<script>
{

['kitchen','ks','light','ספוטים',{b:80,tone:'cool'}],['kitchen','kp','light','מנורות מעל האי',{b:60,tone:'warm'}],['kitchen','kl','light','לד מתחת לארונות',{b:100,tone:'warm',nodim:1}],['kitchen','pl','plate','פלטה',{}],['kitchen','ov','oven','חשמל לתנור',{}],
['hall','eh','light','תאורת מבואה',{b:60,tone:'warm'}],['hall','co','light','תאורת מסדרון',{b:40,tone:'warm'}],['hall','lk','lock','דלת כניסה',{on:1}],['hall','bell','bell','מצלמת פעמון',{}],['hall','mo','motion','חיישן תנועה',{}],
['bath','bl','light','תאורה',{b:100,tone:'cool',nodim:1}],['bath','bm','light','תאורת מראה',{b:100,tone:'cool',nodim:1}],['bath','bo','boiler','דוד מים',{m:45}],

let view='home',scene=null,sheet=null,hr=20,shab=false,rain=false,lastAuto='';
const IC={light:'💡',shutter:'🪟',curtain:'🪟',ac:'❄️',tv:'📺',vac:'🤖',oven:'🍞',plate:'🍲',lock:'🔒',boiler:'♨️',heater:'🔥',temp:'🌡️',irr:'💧',fan:'🌀',bell:'🔔',motion:'🚶'};

function stateTxt(d){switch(d.k){
 case'light':return d.on?(d.nodim?'דולק':'דולק · '+d.b+'%'):'כבוי';
 case'shutter':case'curtain':return d.pos==100?'פתוח':d.pos==0?'סגור':'פתוח · '+d.pos+'%';
 case'ac':return d.on?'חימום · '+d.t+'°':'כבוי';case'tv':return d.on?'דולקת':'כבויה';case'fan':return d.on?'פועל':'כבוי';
 case'vac':return d.on?({vac:'שואב…',mop:'שוטף…',both:'שואב ושוטף…'})[d.mode]:'בתחנה · '+({vac:'שאיבה',mop:'שטיפה',both:'שאיבה ושטיפה'})[d.mode];case'oven':return d.on?'חשמל פתוח':'נעול לילדים';case'plate':return d.on?'פועלת':'כבויה';
 case'lock':return d.on?'נעולה':'פתוחה';case'boiler':return d.on?'מחמם · עוד '+d.m+' דק׳':'כבוי';
 case'heater':return (d.on?'מחמם · ':'כבוי · ')+d.temp.toFixed(1)+'°';case'temp':return d.temp.toFixed(1)+'°';case'irr':return d.on?'משקה…':'כבוי';
 case'bell':return d.on?'צלצול עכשיו!':'אין צלצולים';case'motion':return d.on?'זוהתה תנועה':'אין תנועה'}}
const isOn=d=>d.k=='shutter'||d.k=='curtain'?d.pos>0:d.k=='temp'?0:!!d.on;

 if(d.k=='shutter'||d.k=='curtain')f=`<div class="feat"><button data-sh="${d.id}" data-v="100" aria-label="פתח">▲</button><button data-sh="${d.id}" data-v="50" aria-label="חצי">◼</button><button data-sh="${d.id}" data-v="0" aria-label="סגור">▼</button></div>`;
 if(d.k=='light'&&d.on&&!d.nodim){const bi=L.reduce((m,v,i)=>Math.abs(v-d.b)<Math.abs(L[m]-d.b)?i:m,0);f=`<input type="range" min="0" max="9" value="${bi}" data-br="${d.id}" aria-label="בהירות">`}
 return `<div class="tile${f?' wide':''}" data-open="${d.id}"><div class="th"><button class="ti" data-tg="${d.id}" style="${on?`background:${c}33;color:${c}`:''}" aria-label="הפעלה/כיבוי">${icon(d)}</button><div class="tx"><b>${d.n}</b><span>${stateTxt(d)}</span></div></div>${f}</div>`}
function ui(){
